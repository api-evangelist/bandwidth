description: Bandwidth is a leading cloud-based communications platform providing
  voice, messaging, emergency calling, phone number management, multi-factor authentication,
  and toll-free verification APIs. Built on Bandwidth's own Tier 1 network, the platform
  delivers enterprise-grade reliability for CPaaS applications.
apis:
- aid: bandwidth:phone-numbers-api
  name: Bandwidth Phone Numbers API
  tags:
  - Number Management
  - Phone Numbers
  - Porting
  - Telecom
  - Telephone Numbers
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://dashboard.bandwidth.com/api
  humanURL: https://dev.bandwidth.com/docs/numbers/
  properties:
  - url: https://dev.bandwidth.com/docs/numbers/
    type: Documentation
  - url: openapi/bandwidth-phone-numbers-api-openapi.yml
    type: OpenAPI
  description: >-
    The Bandwidth Phone Numbers API provides programmatic access to search, order, and manage phone numbers
    across the United States and Canada. Developers can search for available local, toll-free, and short
    code numbers, initiate number porting requests, and configure number features such as CNAM, directory
    listings, and line features. The API also supports managing sites, SIP peers, and number assignments
    for organizing telephony resources within an account.
- aid: bandwidth:multi-factor-authentication-api
  name: Bandwidth Multi-Factor Authentication API
  tags:
  - Authentication
  - MFA
  - Security
  - Two-Factor Authentication
  - Verification
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://mfa.bandwidth.com/api/v1
  humanURL: https://dev.bandwidth.com/docs/mfa/
  properties:
  - url: https://dev.bandwidth.com/docs/mfa/
    type: Documentation
  - url: openapi/bandwidth-mfa-api-openapi.yml
    type: OpenAPI
  description: >-
    The Bandwidth Multi-Factor Authentication API allows developers to generate and verify secure MFA
    codes delivered via voice calls or SMS messages. It leverages Bandwidth's Voice and Messaging APIs
    under the hood, handling token generation and management automatically. Developers can customize the
    code length, expiration time, and delivery message template. The API supports both one-time passcode
    delivery and verification in a simple two-step workflow.
- aid: bandwidth:toll-free-verification-api
  name: Bandwidth Toll-Free Verification API
  tags:
  - A2P
  - Messaging Compliance
  - Toll-Free
  - Verification
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://dashboard.bandwidth.com/api
  humanURL: https://dev.bandwidth.com/apis/messaging-apis/toll-free-verification/
  properties:
  - url: https://dev.bandwidth.com/apis/messaging-apis/toll-free-verification/
    type: Documentation
  - url: openapi/bandwidth-toll-free-verification-api-openapi.yml
    type: OpenAPI
  description: >-
    The Bandwidth Toll-Free Verification API enables developers to programmatically submit and manage
    toll-free number verification requests for A2P messaging compliance. It automates the verification
    submission process, allowing developers to view and update the verification status of their toll-free
    numbers.
